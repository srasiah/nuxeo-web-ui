# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

dotenv: ['.env.sample', '.env']

vars:
  # Precedence for every env-backed var below: shell/CLI env > .env file > default.
  # Resolved via scripts/task/env-default.sh because Taskfile v3 dotenv values
  # aren't visible to `sh:` blocks in `vars:`.
  NUXEO_WEB_UI_VERSION:
    sh: scripts/task/env-default.sh NUXEO_WEB_UI_VERSION "$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)"
  NUXEO_VERSION:
    sh: scripts/task/env-default.sh NUXEO_VERSION master
  NUXEO_PACKAGES:
    sh: scripts/task/env-default.sh NUXEO_PACKAGES "nuxeo-drive nuxeo-liveconnect nuxeo-template-rendering"
  NUXEO_DEV_MODE:
    sh: scripts/task/env-default.sh NUXEO_DEV_MODE true

  SCM_REF:
    sh: git rev-parse HEAD 2>/dev/null || echo "local"

  NPM: npm
  DOCKER_COMPOSE: docker-compose

  MAVEN_VERSION:
    sh: scripts/task/env-default.sh MAVEN_VERSION current
  MAVEN_HOME: "{{.HOME}}/.sdkman/candidates/maven/{{.MAVEN_VERSION}}"
  MVN: "{{.MAVEN_HOME}}/bin/mvn"
  MAVEN_OPTS:
    sh: scripts/task/env-default.sh MAVEN_OPTS "-Xmx2g -Xms512m"

  JAVA_VERSION:
    sh: scripts/task/env-default.sh JAVA_VERSION current
  # Precedence: JAVA_VERSION (.env / CLI) > inherited JAVA_HOME > sdkman current.
  JAVA_HOME:
    sh: |
      JV=$(scripts/task/env-default.sh JAVA_VERSION)
      if [ -n "$JV" ]; then
        echo "$HOME/.sdkman/candidates/java/$JV"
      elif [ -n "$JAVA_HOME" ]; then
        echo "$JAVA_HOME"
      else
        echo "$HOME/.sdkman/candidates/java/current"
      fi

  NUXEO_PLUGIN_WEBUI_FILE_PATH:
    sh: scripts/task/env-default.sh NUXEO_PLUGIN_WEBUI_FILE_PATH "./plugin/web-ui/marketplace/target/*.zip"
  NUXEO_BENCHMARK_MARKETPLACE_PATH:
    sh: scripts/task/env-default.sh NUXEO_BENCHMARK_MARKETPLACE_PATH "~/your-projects/nuxeo/docker/nuxeo-benchmark/marketplace/"

  NODE_VERSION:
    sh: node --version 2>/dev/null || echo "not installed"
  NPM_VERSION:
    sh: npm --version 2>/dev/null || echo "not installed"
  MVN_VERSION:
    sh: '{{.MVN}} --version 2>/dev/null | head -1 || echo "not installed"'
  DC_VERSION:
    sh: docker-compose --version 2>/dev/null || echo "not installed"

env:
  JAVA_HOME: "{{.JAVA_HOME}}"
  MAVEN_OPTS: "{{.MAVEN_OPTS}}"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  # ── Installation ────────────────────────────────────────────────────────────

  install:
    desc: Install npm dependencies
    cmds:
      - "{{.NPM}} install"

  check-node:
    desc: Check if Node.js is installed and print version
    preconditions:
      - sh: which node
        msg: "Error: Node.js is not installed"
    cmds:
      - echo "Node.js {{.NODE_VERSION}}"

  # ── Development ─────────────────────────────────────────────────────────────

  start:
    desc: Start development server
    cmds:
      - "{{.NPM}} run start"

  start-build:
    desc: Start HTTP server with built files
    cmds:
      - "{{.NPM}} run start:build"

  # ── Build ────────────────────────────────────────────────────────────────────

  prepare:
    desc: Prepare build environment (i18n, workbox, etc.)
    cmds:
      - "{{.NPM}} run prepare:i18n"
      - "{{.NPM}} run prepare:workbox"

  build:
    desc: Build the project for production
    cmds:
      - "{{.NPM}} run build"

  build-analyze:
    desc: Build and analyze bundle size
    cmds:
      - "{{.NPM}} run build:analyze"

  # ── Testing ──────────────────────────────────────────────────────────────────

  test:
    desc: Run unit tests
    cmds:
      - "{{.NPM}} run test"

  test-watch:
    desc: Run unit tests in watch mode
    cmds:
      - "{{.NPM}} run test:watch"

  ftest:
    desc: Run functional tests (headless)
    cmds:
      - "{{.NPM}} run ftest"

  ftest-headful:
    desc: Run functional tests in headful mode
    cmds:
      - "{{.NPM}} run ftest:headful"

  ftest-dev:
    desc: Run functional tests against local dev server
    cmds:
      - "{{.NPM}} run ftest:dev"

  ftest-watch:
    desc: Run functional tests in watch/debug mode
    cmds:
      - "{{.NPM}} run ftest:watch"

  # ── Lint & Format ────────────────────────────────────────────────────────────

  lint:
    desc: Run linting (ESLint + Prettier)
    cmds:
      - "{{.NPM}} run lint"

  lint-eslint:
    desc: Run ESLint only
    cmds:
      - "{{.NPM}} run lint:eslint"

  lint-prettier:
    desc: Run Prettier check only
    cmds:
      - "{{.NPM}} run lint:prettier"

  format:
    desc: Format code with Prettier and ESLint
    cmds:
      - "{{.NPM}} run format"

  format-eslint:
    desc: Format code with ESLint
    cmds:
      - "{{.NPM}} run format:eslint"

  format-prettier:
    desc: Format code with Prettier
    cmds:
      - "{{.NPM}} run format:prettier"

  # ── Clean ────────────────────────────────────────────────────────────────────

  clean:
    desc: Clean build artifacts and node_modules
    cmds:
      - rm -rf dist/ .tmp/ node_modules/ target/

  clean-dist:
    desc: Clean dist directory only
    cmds:
      - rm -rf dist/

  clean-tmp:
    desc: Clean temporary directory only
    cmds:
      - rm -rf .tmp/

  # ── Maven ────────────────────────────────────────────────────────────────────

  mp-clean:
    desc: Clean Maven build
    cmds:
      - "{{.MVN}} clean"

  mp-build:
    desc: Build marketplace package with Maven
    cmds:
      - "{{.MVN}} clean install"

  mp-build-ftest:
    desc: Build marketplace package with functional tests
    cmds:
      - "{{.MVN}} clean install -Pftest"

  mp-build-skip:
    desc: Build marketplace package (skip tests)
    cmds:
      - "{{.MVN}} clean install -DskipTests"

  # ── Deploy ───────────────────────────────────────────────────────────────────

  copy-to-benchmark:
    desc: Copy marketplace zip to local nuxeo-benchmark marketplace directory
    cmds:
      - cp {{.NUXEO_PLUGIN_WEBUI_FILE_PATH}} {{.NUXEO_BENCHMARK_MARKETPLACE_PATH}}
      - echo "Marketplace package copied to {{.NUXEO_BENCHMARK_MARKETPLACE_PATH}}"

  deploy-plugin:
    desc: Build marketplace package (skip tests) and copy it to the benchmark marketplace directory
    cmds:
      - task: mp-build-skip
      - task: copy-to-benchmark

  # ── Docker ───────────────────────────────────────────────────────────────────

  docker-build:
    desc: Build Docker image
    cmds:
      - "{{.DOCKER_COMPOSE}} build"

  docker-up:
    desc: Start Docker Compose services
    cmds:
      - "{{.DOCKER_COMPOSE}} up"

  docker-up-build:
    desc: Build and start Docker Compose services
    cmds:
      - "{{.DOCKER_COMPOSE}} up --build"

  docker-up-detached:
    desc: Start Docker Compose services in detached mode
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"

  docker-down:
    desc: Stop Docker Compose services
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  docker-logs:
    desc: Show Docker Compose logs
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f"

  docker-clean:
    desc: Remove Docker containers, volumes, and images
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v --rmi all"

  # ── Combined ─────────────────────────────────────────────────────────────────

  all:
    desc: Clean, install dependencies, and build
    cmds:
      - task: clean
      - task: install
      - task: build

  full-build:
    desc: Full build (npm + maven)
    cmds:
      - task: install
      - task: build
      - task: mp-build

  dev:
    desc: Install dependencies and start development server
    cmds:
      - task: install
      - task: start

  ci:
    desc: CI pipeline — install, lint, test, and build
    cmds:
      - task: install
      - task: lint
      - task: test
      - task: build

  # ── Info ─────────────────────────────────────────────────────────────────────

  info:
    desc: Display project information
    silent: true
    cmds:
      - echo "Nuxeo Web UI — Build Configuration"
      - echo ""
      - printf '%-30s %s\n' "Version:" "{{.NUXEO_WEB_UI_VERSION}}"
      - printf '%-30s %s\n' "SCM Ref:" "{{.SCM_REF}}"
      - printf '%-30s %s\n' "Nuxeo Version:" "{{.NUXEO_VERSION}}"
      - printf '%-30s %s\n' "Nuxeo Packages:" "{{.NUXEO_PACKAGES}}"
      - printf '%-30s %s\n' "Dev Mode:" "{{.NUXEO_DEV_MODE}}"
      - echo ""
      - printf '%-30s %s\n' "Node.js:" "{{.NODE_VERSION}}"
      - printf '%-30s %s\n' "NPM:" "{{.NPM_VERSION}}"
      - printf '%-30s %s\n' "Maven:" "{{.MVN_VERSION}}"
      - printf '%-30s %s\n' "MAVEN_HOME:" "{{.MAVEN_HOME}}"
      - printf '%-30s %s\n' "Docker Compose:" "{{.DC_VERSION}}"
      - printf '%-30s %s\n' "JAVA_VERSION:" "{{.JAVA_VERSION}}"
      - printf '%-30s %s\n' "JAVA_HOME:" "{{.JAVA_HOME}}"
      - printf '%-30s %s\n' "MAVEN_OPTS:" "{{.MAVEN_OPTS}}"
